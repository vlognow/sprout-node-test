name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::677637302876:role/github-actions-ecr
        aws-region: us-east-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push image
      id: build
      run: |
        TAG="sha-${GITHUB_SHA::8}"
        IMAGE="677637302876.dkr.ecr.us-east-1.amazonaws.com/sprout-node-test:$TAG"

        # Unsubstituted __PORT__ means the port patch was skipped — fail
        # loud here instead of CrashLooping in-cluster (k8s-prototypes#79).
        # nginx.node.conf carries the node path's listen port, so check it too.
        for f in Dockerfile nginx.node.conf; do
          if [ -f "$f" ] && grep -q __PORT__ "$f"; then
            echo "::error::unsubstituted __PORT__ in $f"
            exit 1
          fi
        done
        docker build -f Dockerfile -t "$IMAGE" .
        # ECR IAM tag propagation can lag provisioning (k8s-prototypes#40):
        # first pushes get InitiateLayerUpload/CompleteLayerUpload denials.
        for attempt in 1 2 3; do
          if docker push "$IMAGE"; then break; fi
          if [ "$attempt" = "3" ]; then echo "::error::docker push failed after 3 attempts"; exit 1; fi
          sleep $(( attempt * 30 ))
        done
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Mint sprout-ci dispatch token
      id: dispatch-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ vars.SPROUT_CI_GITHUB_CLIENT_ID }}
        private-key: ${{ secrets.SPROUT_CI_GITHUB_KEY }}
        owner: vlognow
        repositories: k8s-prototypes
        permission-actions: write

    - name: Request tag bump in k8s-prototypes
      env:
        GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        TAG: ${{ steps.build.outputs.tag }}
      run: |
        set -euo pipefail
        # k8s-prototypes' tag-bump.yaml identifies this repo by its signed
        # GitHub OIDC token (needs the job's id-token: write), validates the
        # request, and opens the tag-bump PR as machi-sre[bot].
        ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=k8s-prototypes-tag-bump" | jq -r .value)
        echo "::add-mask::$ID_TOKEN"
        gh workflow run tag-bump.yaml -R vlognow/k8s-prototypes --ref main \
          -f name="sprout-node-test" -f tag="$TAG" -f id_token="$ID_TOKEN"
